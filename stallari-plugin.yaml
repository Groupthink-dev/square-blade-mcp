name: square-blade-mcp
version: "0.2.0"
description: "Square MCP — payments-v1 (payments, refunds, customers, cards, locations, orders, catalog, inventory, disputes, webhooks) + billing-v1 (subscriptions, plans, invoices). Token-efficient with pipe-delimited output, field selection, human-readable money. PCI-safe card output."
author: groupthink-dev
license: MIT
tier: certified
author_type: first-party
readiness: beta
homepage: https://github.com/Groupthink-dev/square-blade-mcp
contract:
  - payments-v1
  - billing-v1

services:
  payments:
    # Meta
    info: square_info
    # Payments
    payment_list: square_payments
    payment_get: square_payment
    payment_create: square_create_payment
    payment_cancel: square_cancel_payment
    payment_complete: square_complete_payment
    # Refunds
    refund_list: square_refunds
    refund_get: square_refund
    refund_create: square_create_refund
    # Customers
    customer_list: square_customers
    customer_search: square_search_customers
    customer_get: square_customer
    customer_create: square_create_customer
    customer_update: square_update_customer
    customer_delete: square_delete_customer
    # Cards on file
    card_list: square_cards
    card_get: square_card
    card_create: square_create_card
    card_disable: square_disable_card
    # Locations
    location_list: square_locations
    location_get: square_location
    # Orders
    order_create: square_create_order
    order_get: square_order
    order_list: square_search_orders
    order_update: square_update_order
    order_pay: square_pay_order
    # Catalog
    catalog_list: square_catalog
    catalog_get: square_catalog_object
    # Inventory
    inventory_count: square_inventory
    # Disputes
    dispute_list: square_disputes
    dispute_get: square_dispute
    # Webhooks
    webhook_subscription_list: square_webhook_subscriptions
    webhook_subscription_create: square_create_webhook_subscription
    webhook_subscription_delete: square_delete_webhook_subscription
    webhook_event_types: square_webhook_event_types
    webhook_verify: square_verify_webhook

  # ----------------------------------------------------------------------
  # billing-v1 mappings (Square Subscriptions + Invoices APIs).
  # Square's catalog covers products/prices/discounts/plans;
  # the Subscriptions API drives recurring billing; payments + refunds
  # surface as billing transactions and adjustments. Honest gaps are
  # listed in not_supported below.
  # ----------------------------------------------------------------------
  billing:
    # Required
    products: square_catalog
    product: square_catalog_object
    prices: square_catalog
    customers: square_customers
    subscriptions: square_subscription_list
    transactions: square_payments
    # Recommended
    customer: square_customer
    subscription: square_subscription
    transaction: square_payment
    invoice: square_invoice
    adjustments: square_refunds
    discounts: square_catalog
    # Optional
    payment_methods: square_cards
    verify_webhook: square_verify_webhook
    # Gated
    create_customer: square_create_customer
    update_subscription: square_update_subscription
    cancel_subscription: square_cancel_subscription
    create_transaction: square_create_payment
    create_adjustment: square_create_refund
    # Square-specific extensions (not in canonical billing-v1 op set,
    # but useful aliases for callers that map plans/invoices through this server):
    subscription_list: square_subscription_list
    subscription_get: square_subscription
    subscription_create: square_create_subscription
    subscription_pause: square_pause_subscription
    subscription_resume: square_resume_subscription
    plan_list: square_subscription_plans
    plan_get: square_subscription_plan
    plan_create: square_create_subscription_plan
    invoice_list: square_invoice_list
    invoice_get: square_invoice
    invoice_create: square_create_invoice
    invoice_send: square_send_invoice
    invoice_cancel: square_cancel_invoice

# Operations declared in the contracts that Square does not support
# in this server. Required ops in this list are honest gaps — discovery
# must filter Square out when these ops are demanded by an operator.
not_supported:
  # payments-v1 gaps (carried forward from 0.1.0)
  - card_delete                # use card_disable (soft delete)
  - payment_void               # gated, deferred
  - refund_unlinked            # gated, deferred
  - inventory_adjust           # gated, deferred
  # billing-v1 gaps
  - credit_balance             # Square has no equivalent customer credit ledger API
  - events                     # use webhook_event_types via payments-v1
  - notifications              # webhook subscriptions only — no operator-facing notification list/inspect
  - reports                    # Square Reporting API is gated and outside this server's scope
  - preview_transaction        # Square has no off-the-shelf transaction preview endpoint
  - ip_addresses               # Square does not publish webhook source IP allowlists
  - create_discount            # Discounts live in the Catalog upsert path (not exposed as a typed billing op here)
  - replay_notification        # Square has no notification replay; redeliver via webhook configuration in the dashboard
  - simulate                   # Square has no billing simulation endpoint

setup:
  auth_model: api_key   # PAT for v0.2.0; OAuth in v0.3.0
  complexity: moderate
  icon: "square.fill"
  product: "Square"
  blurb: "Connect to Square for in-person and online payments, plus subscription billing and invoices."
  fields:
    - key: SQUARE_ACCESS_TOKEN
      label: "Access Token (PAT)"
      secret: true
      required: true
      placeholder: "EAAA..."
      help: "Square personal access token from Developer Dashboard. Use a sandbox token for testing."
    - key: SQUARE_ENVIRONMENT
      label: "Environment"
      secret: false
      required: true
      placeholder: "sandbox or production"
      help: "Must be sandbox or production. Fail-closed on invalid values."
    - key: SQUARE_WEBHOOK_SIGNATURE_KEY
      label: "Webhook Signature Key"
      secret: true
      required: false
      placeholder: "Optional — required only if verifying inbound webhooks"
      help: "From the Square webhook subscription settings. Used by square_verify_webhook."
  test:
    endpoint: "https://connect.squareupsandbox.com/v2/locations"
    auth_style: bearer
    auth_header: "Authorization"
  help:
    - label: "Square Developer Docs"
      url: "https://developer.squareup.com/docs"
    - label: "Create Access Token (Sandbox)"
      url: "https://developer.squareup.com/apps"

install:
  runtime: uv
  package: square-blade-mcp

env:
  - name: SQUARE_ACCESS_TOKEN
    description: "Square access token (EAAA*)"
    secret: true
  - name: SQUARE_ENVIRONMENT
    description: "sandbox or production (mandatory)"
    secret: false
  - name: SQUARE_WRITE_ENABLED
    description: "Enable write operations (create/update/cancel/delete)"
    default: "false"
  - name: SQUARE_WEBHOOK_SIGNATURE_KEY
    description: "Signing key for webhook HMAC verification"
    secret: true
  - name: SQUARE_MCP_TRANSPORT
    description: "Transport mode: stdio (default) or http"
    default: "stdio"
  - name: SQUARE_MCP_HOST
    description: "HTTP transport bind host"
    default: "127.0.0.1"
  - name: SQUARE_MCP_PORT
    description: "HTTP transport bind port"
    default: "8770"
  - name: SQUARE_MCP_API_TOKEN
    description: "Bearer token for HTTP transport auth"
    secret: true

requires:
  stallari: ">=0.60"

  adapter_contracts:
    - "billing >= 1.0"
    - "payments >= 1.0"
conformance:
  payments-v1:
    required: "12/12"
    recommended: "8/8"
    optional: "10/10"
    gated: "2/6"
    last_tested: "2026-04-28"
  billing-v1:
    required: "6/6"        # products, product, prices, customers, subscriptions, transactions
    recommended: "6/8"     # missing credit_balance, events
    optional: "2/6"        # payment_methods, verify_webhook (notifications, reports, preview_transaction, ip_addresses not supported)
    gated: "5/8"           # create_customer, update_subscription, cancel_subscription, create_transaction, create_adjustment (create_discount, replay_notification, simulate not supported)
    last_tested: "2026-04-28"
